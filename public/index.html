<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Heatline</title>
<meta name="description" content="A night-time heist in sodium light. Sneak or shoot your way to the money, then outrun the cops.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
/* Identity: a crew's night out in sodium streetlight. Near-black streets, bone-coloured type,
   one accent (sodium orange). Siren red only ever means danger. Stencil display over a condensed grotesk. */
:root{
  --night:#0d0f12;
  --night-2:#16191d;
  --rule:#2a2e33;
  --bone:#d9d2c3;
  --dim:#8a8476;
  --sodium:#f5a623;
  --siren:#d6312b;
  --display:'Saira Stencil One',Impact,'Arial Narrow',sans-serif;
  --ui:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutR:max(16px,env(safe-area-inset-right,0px));
  --top:max(14px,env(safe-area-inset-top,0px));
  --bot:max(14px,env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--bone);font-family:var(--ui);font-weight:600;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
body[data-input="keys"] #game{cursor:none}
#menu:not([hidden]) ~ #game, body:has(#menu:not([hidden])) #game{cursor:default}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--sodium);outline-offset:3px}

/* ---------- Menu: title stacked bottom-left, job ledger top-right ---------- */
#menu{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);grid-template-rows:1fr auto;
  padding:var(--top) var(--gutR) var(--bot) var(--gut);gap:20px 40px;
  background:linear-gradient(90deg,rgba(13,15,18,.86) 0%,rgba(13,15,18,.35) 42%,rgba(13,15,18,0) 60%,rgba(13,15,18,.8) 78%)}
.title{grid-column:1;grid-row:1/3;align-self:end;margin:0;line-height:.78;font-family:var(--display);font-weight:400;
  font-size:clamp(84px,15vw,230px);letter-spacing:-.01em;text-transform:uppercase}
.title span{display:block}
.title span:last-child{color:var(--sodium);margin-left:.42em}
.tagline{display:block;font-family:var(--ui);font-size:clamp(14px,1.4vw,18px);letter-spacing:.22em;color:var(--dim);margin:0 0 18px .2em;line-height:1.3;max-width:28ch}
.ledger{grid-column:2;grid-row:1;align-self:start;margin-top:clamp(8px,6vh,72px);list-style:none;padding:0;display:flex;flex-direction:column}
.ledger h2{font-family:var(--ui);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:600}
.job{position:relative;display:grid;grid-template-columns:56px 1fr auto;align-items:baseline;gap:0 12px;width:100%;text-align:left;
  padding:14px 4px 14px 0;border-top:1px solid var(--rule);transition:padding .2s}
.job:last-of-type{border-bottom:1px solid var(--rule)}
.job .n{font-family:var(--display);font-size:30px;color:var(--sodium);line-height:1}
.job .nm{font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.job .meta{grid-column:2/4;font-size:14px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-top:6px;font-weight:500}
.job .go{font-size:22px;color:var(--dim);transition:transform .2s,color .2s}
.job:hover .go,.job:focus-visible .go{color:var(--sodium);transform:translateX(4px)}
.job:hover{padding-left:10px}
.job.minor .n{color:var(--dim)}
.job.minor .nm{font-size:22px}
.foot{grid-column:2;grid-row:2;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.chip{border:1px solid var(--rule);padding:6px 10px}
@media (max-width:760px){
  #menu{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;background:linear-gradient(180deg,rgba(13,15,18,.2) 0%,rgba(13,15,18,.55) 30%,rgba(13,15,18,.92) 60%);overflow-y:auto;touch-action:pan-y}
  .title{grid-row:1;font-size:clamp(76px,26vw,140px);align-self:start;margin-top:4vh}
  .ledger{grid-column:1;grid-row:2;align-self:end;margin-top:20px}
  .foot{grid-column:1;grid-row:3}
}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;left:var(--gut);top:var(--top);display:flex;flex-direction:column;gap:10px}
#hp{width:clamp(130px,18vw,200px);height:8px;background:rgba(217,210,195,.14);position:relative}
#hpFill{position:absolute;inset:0;background:var(--bone);transform-origin:left;transition:transform .15s}
#hp.low #hpFill{background:var(--siren)}
#eye{display:flex;align-items:center;gap:6px}
#eye svg{width:22px;height:22px;color:var(--dim)}
#eye i{width:12px;height:6px;background:rgba(217,210,195,.16)}
#eye i.on{background:var(--sodium)}
.tr{position:absolute;right:var(--gutR);top:var(--top);display:flex;align-items:flex-start;gap:14px}
.stack{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#take{font-family:var(--display);font-size:clamp(26px,3.4vw,36px);line-height:1;color:var(--bone)}
#ammoBox{display:flex;align-items:baseline;gap:6px;font-size:22px;line-height:1}
#ammo{font-family:var(--display);font-size:26px}
#reserve{color:var(--dim)}
#ammoBox svg{width:12px;height:18px;color:var(--sodium);align-self:center}
#boostBox{width:120px;height:8px;background:rgba(217,210,195,.14);position:relative;margin-top:6px}
#boostFill{position:absolute;inset:0;background:var(--sodium);transform-origin:left}
#pauseBtn{pointer-events:auto;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--rule);background:rgba(13,15,18,.5)}
#pauseBtn svg{width:16px;height:16px}
#alarm{position:absolute;left:50%;top:var(--top);transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--siren);color:var(--night);
  padding:6px 14px 6px 10px;font-size:15px;letter-spacing:.24em;text-transform:uppercase;animation:alarm 1s steps(2) infinite}
#alarm svg{width:22px;height:22px}
@keyframes alarm{50%{background:#8f1f1b;color:var(--bone)}}
#ctx{position:fixed;left:0;top:0;margin:-30px 0 0 -30px;width:60px;height:60px;display:grid;place-items:center;pointer-events:none}
#ctx .ring{position:absolute;inset:0}
#ctx .ring circle{fill:rgba(13,15,18,.72);stroke:var(--sodium);stroke-width:3;stroke-dasharray:113;transform:rotate(-90deg);transform-origin:center}
#ctx .ring circle.bg{stroke:rgba(245,166,35,.25);stroke-dasharray:none}
#ctxIcon{position:relative;width:28px;height:28px;color:var(--sodium)}
#ctxIcon svg{width:100%;height:100%;display:block}
#ctx .cap{position:absolute;right:-6px;bottom:-4px;background:var(--bone);color:var(--night);font-size:13px;line-height:1;padding:3px 5px}
body[data-input="touch"] #ctx .cap{display:none}
#ctx .alt{position:absolute;left:-38px;top:16px;display:none;align-items:center;gap:2px;color:var(--siren);background:rgba(13,15,18,.72);padding:3px 4px}
#ctx .alt svg{width:16px;height:16px}
#ctx .alt .ms{width:9px;height:14px;color:var(--bone)}
#ctx.alt .alt{display:flex}
body[data-input="touch"] #ctx .alt{display:none!important}
#exitArrow{position:fixed;left:0;top:0;margin:-18px 0 0 -18px;width:36px;height:36px;color:var(--sodium);pointer-events:none}
#reticle{position:fixed;left:0;top:0;margin:-14px 0 0 -14px;width:28px;height:28px;pointer-events:none;color:var(--bone);transition:width .08s,height .08s,margin .08s}
#reticle.kick{width:36px;height:36px;margin:-18px 0 0 -18px}
#reticle.reload{color:var(--dim)}
.veil{position:fixed;inset:0;pointer-events:none;opacity:0}
#hurtV{background:radial-gradient(ellipse at center,rgba(214,49,43,0) 45%,rgba(120,10,10,.75) 100%)}
#flashV{background:var(--sodium);mix-blend-mode:multiply}

/* ---------- Touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;top:0;bottom:0;width:52%;pointer-events:auto;touch-action:none}
.stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border:2px solid rgba(217,210,195,.35);border-radius:50%;pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(217,210,195,.55)}
#ghostStick{left:24%;top:72%}
#ghostStick i{animation:ghost 1.8s ease-in-out infinite}
@keyframes ghost{0%,100%{transform:translate(0,0)}25%{transform:translate(0,-34px)}50%{transform:translate(34px,0)}75%{transform:translate(0,34px)}}
.pad{position:absolute;right:calc(var(--gutR) + 4px);bottom:calc(var(--bot) + 8px);width:220px;height:200px;pointer-events:none}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;color:var(--bone);
  background:rgba(13,15,18,.55);border:2px solid rgba(217,210,195,.4)}
.tb .ic{width:46%;height:46%}
.tb .ic svg{width:100%;height:100%;display:block}
.tb.on{background:rgba(217,210,195,.25)}
#bFire{right:0;bottom:0;width:92px;height:92px;border-color:var(--bone)}
#bAct{right:104px;bottom:6px;width:70px;height:70px;border-color:var(--sodium);color:var(--sodium)}
#bAct.idle{opacity:.35}
#bCrouch{right:22px;bottom:108px;width:60px;height:60px}
#bCrouch.lit{background:var(--bone);color:var(--night)}
.tb.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{box-shadow:0 0 0 10px rgba(245,166,35,.35)}}

/* ---------- Tutorial ---------- */
#tut{position:fixed;left:50%;top:calc(var(--top) + 40px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;text-align:center}
#tutWord{font-family:var(--display);font-size:clamp(46px,8vw,84px);line-height:.9;text-transform:uppercase;color:var(--bone)}
#tutWord.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#tutGlyph svg{width:150px;height:92px}
@media (max-width:640px){#tut{top:calc(var(--top) + 118px)}}
#tutGlyph .cap{fill:var(--bone)}
#tutGlyph .lip{fill:#6c675c}
#tutGlyph text{font-family:var(--ui);font-weight:700;font-size:22px;fill:var(--night)}
#tutGlyph .press{animation:press 1.4s ease-in-out infinite}
#tutGlyph .p1{animation-delay:.35s}#tutGlyph .p2{animation-delay:.7s}#tutGlyph .p3{animation-delay:1.05s}
@keyframes press{0%,60%,100%{transform:translateY(0);fill:var(--bone)}20%{transform:translateY(5px);fill:var(--sodium)}}
#tutGlyph path.press{fill:var(--sodium);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{fill:var(--bone)}}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:4px;background:rgba(217,210,195,.2)}
.dots i.done{background:var(--bone)}
.dots i.now{background:var(--sodium)}
#skip{position:fixed;right:var(--gutR);top:calc(var(--top) + 56px);width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--rule);background:rgba(13,15,18,.5)}
#skip svg{width:18px;height:18px}

/* ---------- Sheets ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:end start;padding:var(--top) var(--gutR) var(--bot) var(--gut);background:rgba(13,15,18,.72)}
.sheet{width:min(560px,100%);border-left:4px solid var(--sodium);padding:4px 0 4px 22px;margin:0 0 6vh 2vw}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(64px,12vw,128px);line-height:.85;margin:0 0 18px;text-transform:uppercase}
.sheet h2[data-kind="lose"]{color:var(--siren)}
.sheet dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 24px;margin:0 0 24px}
.sheet dl div{border-top:1px solid var(--rule);padding-top:6px}
.sheet dt{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.sheet dd{margin:2px 0 0;font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 22px;border:1px solid var(--bone);font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.btn.primary{background:var(--sodium);border-color:var(--sodium);color:var(--night)}
.btn:hover{background:var(--bone);color:var(--night)}
.btn.primary:hover{background:#ffb84a}
body.driving #eye,body.driving #bAct{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="game" aria-label="Heatline game view"></canvas>

<section id="menu" hidden>
  <h1 class="title"><small class="tagline">Two jobs on the east side. One van. Keep to the dark.</small><span>Heat</span><span>line</span></h1>
  <nav class="ledger" aria-label="Jobs">
    <h2>Tonight</h2>
    <button class="job" data-job="bank" type="button"><span class="n">01</span><span class="nm">First National</span><span class="go">→</span><span class="meta">9 bags · 6 guards · 3 cameras</span></button>
    <button class="job" data-job="jewel" type="button"><span class="n">02</span><span class="nm">Marlow Jewellers</span><span class="go">→</span><span class="meta">6 bags · 7 guards · glass everywhere</span></button>
    <button class="job minor" data-job="sandbox" type="button"><span class="n">SB</span><span class="nm">Open block</span><span class="go">→</span><span class="meta">Sandbox · endless ammo</span></button>
    <button class="job minor" data-job="train" type="button"><span class="n">00</span><span class="nm">Corner shop</span><span class="go">→</span><span class="meta">Training</span></button>
  </nav>
  <footer class="foot"><span class="chip" id="inputChip"></span><span id="best"></span></footer>
</section>

<div id="hud" hidden>
  <div class="tl">
    <div id="hp"><i id="hpFill"></i></div>
    <div id="eye"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="alarm" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 24a11 11 0 0 1 16 0M4 20a17 17 0 0 1 24 0" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="27" r="3" fill="currentColor"/></svg>Alarm</div>
  <div class="tr">
    <div class="stack">
      <b id="take">$0</b>
      <div id="ammoBox"><svg viewBox="0 0 12 18" aria-hidden="true"><path d="M2 7a4 4 0 0 1 8 0v10H2z" fill="currentColor"/></svg><span id="ammo">10</span><span id="reserve">30</span></div>
      <div id="boostBox" hidden><i id="boostFill"></i></div>
    </div>
    <button id="pauseBtn" type="button" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg></button>
  </div>
</div>
<div id="ctx" hidden><svg class="ring" viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="18"/><circle id="ctxRing" cx="20" cy="20" r="18"/></svg><div id="ctxIcon"></div><span class="cap">E</span><span class="alt"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 26 20 12l3-6 3 3-6 3L6 26z" fill="currentColor"/></svg><svg class="ms" viewBox="0 0 12 18" aria-hidden="true"><rect x="1" y="1" width="10" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M1.8 6.5a4.2 4.2 0 0 1 4.2-4.7v4.7z" fill="#f5a623"/></svg></span></div>
<svg id="exitArrow" viewBox="0 0 36 36" hidden aria-hidden="true"><path d="M6 6l26 12L6 30l7-12z" fill="currentColor"/></svg>
<svg id="reticle" viewBox="0 0 28 28" hidden aria-hidden="true"><path d="M14 2v7M14 19v7M2 14h7M19 14h7" stroke="currentColor" stroke-width="2.2"/><circle cx="14" cy="14" r="1.6" fill="#f5a623"/></svg>
<div class="veil" id="hurtV"></div>
<div class="veil" id="flashV"></div>

<div id="touch" hidden>
  <div id="stickZone"></div>
  <div class="stick" id="stick" hidden><i></i></div>
  <div class="stick" id="ghostStick" hidden><i></i></div>
  <div class="pad">
    <button class="tb" id="bCrouch" type="button" aria-label="Sneak"><span class="ic"></span></button>
    <button class="tb" id="bAct" type="button" aria-label="Action"><span class="ic"></span></button>
    <button class="tb" id="bFire" type="button" aria-label="Fire"><span class="ic"></span></button>
  </div>
</div>

<div id="tut" hidden><div id="tutWord"></div><div id="tutGlyph"></div><div class="dots" id="tutDots"></div></div>
<button id="skip" type="button" aria-label="Skip training" hidden><svg viewBox="0 0 24 24"><path d="M4 5l8 7-8 7M12 5l8 7-8 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg></button>

<div class="overlay" id="pause" hidden>
  <div class="sheet">
    <h2>Hold</h2>
    <div class="row"><button class="btn primary" id="pResume" type="button">Resume</button><button class="btn" id="pRestart" type="button">Restart</button><button class="btn" id="pMenu" type="button">Jobs</button></div>
  </div>
</div>
<div class="overlay" id="result" hidden>
  <div class="sheet">
    <h2 id="rTitle">Clean</h2>
    <dl id="rStats"></dl>
    <div class="row"><button class="btn primary" id="rAgain" type="button">Again</button><button class="btn" id="rMenu" type="button">Jobs</button></div>
  </div>
</div>
<script type="module" src="./js/game.js"></script>
</body>
</html>
